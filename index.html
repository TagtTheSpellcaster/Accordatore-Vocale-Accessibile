<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Accordatore Vocale Accessibile v1.1.0</title>
  
  <!-- Configurazione PWA completa -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Accordatore">
  <link rel="apple-touch-icon" href="icon-192.png">

  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #000000;
      color: #ffffff;
      font-family: system-ui, -apple-system, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }
    
    #touchZone {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      text-align: center;
      box-sizing: border-box;
      padding: 20px;
      touch-action: none;
    }

    #touchZone:active {
      background-color: #1a1a1a;
    }

    .mode-badge {
      font-size: 1.5rem;
      font-weight: 600;
      color: #00ffcc;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 15px;
      background-color: rgba(0, 255, 204, 0.1);
      padding: 8px 20px;
      border-radius: 20px;
      border: 1px solid #00ffcc;
    }

    .gauge-container {
      width: 90%;
      max-width: 600px;
      height: 120px;
      margin-bottom: 25px;
      position: relative;
      background: linear-gradient(
        to right,
        #ff0000 0%,
        #ff7700 20%,
        #ffff00 35%,
        #00ff00 50%,
        #ffff00 65%,
        #ff7700 80%,
        #ff0000 100%
      );
      border: 4px solid #ffffff;
      border-radius: 12px;
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
      overflow: hidden;
    }

    .gauge-center-line {
      position: absolute;
      top: 0;
      left: 50%;
      width: 4px;
      height: 100%;
      background-color: #ffffff;
      transform: translateX(-50%);
      z-index: 1;
      opacity: 0.6;
    }

    .gauge-needle {
      position: absolute;
      top: 0;
      left: 50%;
      width: 10px;
      height: 100%;
      background-color: #ffffff;
      box-shadow: 0 0 10px #000000;
      transform: translateX(-50%);
      z-index: 2;
    }

    .status-large {
      font-size: 3.5rem;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .sub-status {
      font-size: 1.8rem;
      color: #aaaaaa;
    }
  </style>
</head>
<body>

<div id="touchZone" role="button" tabindex="0">
  <div class="mode-badge" id="modeDisplay">CROMATICO</div>
  <div class="gauge-container" id="gaugeBox">
    <div class="gauge-center-line"></div>
    <div class="gauge-needle" id="gaugeNeedle"></div>
  </div>
  <div class="status-large" id="mainStatus">TOCCA PER AVVIARE</div>
  <div class="sub-status" id="subStatus">Scorri ai lati per cambiare strumento</div>
</div>

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch(err => console.error(err));
    });
  }

  const touchZone = document.getElementById('touchZone');
  const mainStatus = document.getElementById('mainStatus');
  const subStatus = document.getElementById('subStatus');
  const modeDisplay = document.getElementById('modeDisplay');
  const gaugeNeedle = document.getElementById('gaugeNeedle');

  let audioCtx = null;
  let analyser = null;
  let isRunning = false;
  let isSpeaking = false; // Flag globale per disabilitare l'ascolto durante QUALSIASI pronuncia

  const noteNames = ["Do", "Do diesis", "Re", "Re diesis", "Mi", "Fa", "Fa diesis", "Sol", "Sol diesis", "La", "La diesis", "Si"];

  const MODALITA_STRUMENTI = [
    { id: "cromatico", nome: "Cromatico", corde: [] },
    { 
      id: "chitarra", 
      nome: "Chitarra", 
      corde: [
        { numero: 1, nota: "Mi", freq: 329.63 },
        { numero: 2, nota: "Si", freq: 246.94 },
        { numero: 3, nota: "Sol", freq: 196.00 },
        { numero: 4, nota: "Re", freq: 146.83 },
        { numero: 5, nota: "La", freq: 110.00 },
        { numero: 6, nota: "Mi", freq: 82.41 }
      ]
    },
    { 
      id: "ukulele", 
      nome: "Ukulele", 
      corde: [
        { numero: 1, nota: "La", freq: 440.00 },
        { numero: 2, nota: "Mi", freq: 329.63 },
        { numero: 3, nota: "Do", freq: 261.63 },
        { numero: 4, nota: "Sol", freq: 392.00 }
      ]
    },
    { 
      id: "basso", 
      nome: "Basso", 
      corde: [
        { numero: 1, nota: "Sol", freq: 98.00 },
        { numero: 2, nota: "Re", freq: 73.42 },
        { numero: 3, nota: "La", freq: 55.00 },
        { numero: 4, nota: "Mi", freq: 41.20 }
      ]
    }
  ];

  let indexModalita = 0;

  let lastValidNote = "";
  let lastValidStatus = "";
  let lastValidCorda = "";
  let lastValidTime = 0;
  let lastSpokenPhrase = "";

  let currentPosPercent = 50;
  let targetPosPercent = 50;
  let currentCentsFiltered = 0;

  const SOGLIA_VOLUME = 0.015;
  let voceItaliana = null;

  function scegliVoceItaliana() {
    if (!("speechSynthesis" in window)) return;
    const voci = window.speechSynthesis.getVoices();
    if (!voci || voci.length === 0) return;

    const italiane = voci.filter(v => v.lang && v.lang.toLowerCase().startsWith("it"));
    if (italiane.length === 0) return;

    const preferite = [/\belsa\b/i, /\b(alice|federica|paola|lucia|carla|sofia|elisa|silvia|serena)\b/i, /female|donna|femminile/i];
    for (const pattern of preferite) {
      const trovata = italiane.find(v => pattern.test(v.name));
      if (trovata) { voceItaliana = trovata; return; }
    }
    voceItaliana = italiane[0];
  }

  if ("speechSynthesis" in window) {
    scegliVoceItaliana();
    window.speechSynthesis.onvoiceschanged = scegliVoceItaliana;
  }

  // Funzione centralizzata di sintesi: blocca l'ascolto IMMEDIATAMENTE
  function parla(testo) {
    if (!("speechSynthesis" in window)) return;

    // Imposta immediatamente il flag a true PRIMA di cancellare o inviare la nuova frase
    isSpeaking = true;

    scegliVoceItaliana();
    window.speechSynthesis.cancel();

    const utterance = new SpeechSynthesisUtterance(testo);
    utterance.lang = "it-IT";
    if (voceItaliana) utterance.voice = voceItaliana;
    utterance.rate = 0.95;
    utterance.pitch = 1.05;

    utterance.onstart = () => {
      isSpeaking = true;
    };

    // Sblocca l'ascolto solo 350 ms DOPO la fine della pronuncia per dissipare l'eco
    utterance.onend = () => {
      setTimeout(() => {
        isSpeaking = false;
      }, 350);
    };

    utterance.onerror = () => {
      isSpeaking = false;
    };

    window.speechSynthesis.speak(utterance);
  }

  function cambiaModalita(direzione) {
    indexModalita = (indexModalita + direzione + MODALITA_STRUMENTI.length) % MODALITA_STRUMENTI.length;
    const strum = MODALITA_STRUMENTI[indexModalita];
    modeDisplay.textContent = strum.nome.toUpperCase();
    lastSpokenPhrase = "";
    // Annuncio dello strumento: parla() muta subito il microfono
    parla(strum.nome);
  }

  function gestisciAnnuncioVocale(nota, stato, infoCorda) {
    if (isSpeaking) return;

    const statoParlato = stato === "troppo bassa"
      ? "troppo basso"
      : stato === "troppo alta"
        ? "troppo alto"
        : "accordato";

    let frase = "";
    if (infoCorda) {
      frase = `Corda ${infoCorda.numero} ${infoCorda.nota}, ${statoParlato}`;
    } else {
      frase = `${nota}, ${statoParlato}`;
    }

    if (frase !== lastSpokenPhrase) {
      parla(frase);
      lastSpokenPhrase = frase;
    }
  }

  function getNoteFromFrequency(freq) {
    const strum = MODALITA_STRUMENTI[indexModalita];
    
    let cordaTrovata = null;
    if (strum.corde.length > 0) {
      let minDiff = Infinity;
      for (const c of strum.corde) {
        const diff = Math.abs(1200 * Math.log2(freq / c.freq));
        if (diff < minDiff) {
          minDiff = diff;
          cordaTrovata = c;
        }
      }
    }

    const A4 = 440;
    const noteNum = 12 * (Math.log(freq / A4) / Math.log(2)) + 69;
    const roundedNote = Math.round(noteNum);
    const noteIndex = (roundedNote % 12 + 12) % 12;
    
    let exactFreq = A4 * Math.pow(2, (roundedNote - 69) / 12);
    if (cordaTrovata) {
      exactFreq = cordaTrovata.freq;
    }

    const cents = Math.floor(1200 * Math.log2(freq / exactFreq));
    
    return {
      name: cordaTrovata ? cordaTrovata.nota : noteNames[noteIndex],
      cents: cents,
      cordaInfo: cordaTrovata
    };
  }

  function autoCorrelate(buffer, sampleRate) {
    const SIZE = buffer.length;
    let rms = 0;
    for (let i = 0; i < SIZE; i++) {
      const val = buffer[i];
      rms += val * val;
    }
    rms = Math.sqrt(rms / SIZE);

    if (rms < SOGLIA_VOLUME) return -1;

    let r1 = 0, r2 = SIZE - 1, thres = 0.2;
    for (let i = 0; i < SIZE / 2; i++) {
      if (Math.abs(buffer[i]) < thres) { r1 = i; break; }
    }
    for (let i = 1; i < SIZE / 2; i++) {
      if (Math.abs(buffer[SIZE - i]) < thres) { r2 = SIZE - i; break; }
    }

    const buf2 = buffer.slice(r1, r2);
    const c = new Array(buf2.length).fill(0);
    for (let i = 0; i < buf2.length; i++) {
      for (let j = 0; j < buf2.length - i; j++) {
        c[i] = c[i] + buf2[j] * buf2[j + i];
      }
    }

    let d = 0;
    while (c[d] > c[d + 1]) d++;
    let maxval = -1, maxpos = -1;
    for (let i = d; i < buf2.length; i++) {
      if (c[i] > maxval) {
        maxval = c[i];
        maxpos = i;
      }
    }
    let T0 = maxpos;

    const x1 = c[T0 - 1], x2 = c[T0], x3 = c[T0 + 1];
    const a = (x1 + x3 - 2 * x2) / 2;
    const b = (x3 - x1) / 2;
    if (a) T0 = T0 - b / (2 * a);

    return sampleRate / T0;
  }

  function updatePitch() {
    // Se l'app sta parlando per QUALSIASI motivo, ignora completamente l'input microfonico
    if (!isSpeaking && audioCtx && audioCtx.state === 'running') {
      const buf = new Float32Array(2048);
      analyser.getFloatTimeDomainData(buf);
      const freq = autoCorrelate(buf, audioCtx.sampleRate);

      if (freq !== -1 && freq > 30 && freq < 2000) {
        const note = getNoteFromFrequency(freq);
        
        currentCentsFiltered += (note.cents - currentCentsFiltered) * 0.25;

        let stato = "";
        if (Math.abs(currentCentsFiltered) <= 6) {
          stato = "accordato";
        } else if (currentCentsFiltered < -6) {
          stato = "troppo bassa";
        } else {
          stato = "troppo alta";
        }

        const centsClamped = Math.max(-50, Math.min(50, currentCentsFiltered));
        targetPosPercent = ((centsClamped + 50) / 100) * 100;

        if (note.cordaInfo) {
          mainStatus.textContent = `Corda ${note.cordaInfo.numero}: ${note.name}`;
        } else {
          mainStatus.textContent = `${note.name}`;
        }
        subStatus.textContent = stato.toUpperCase();

        lastValidNote = note.name;
        lastValidStatus = stato;
        lastValidCorda = note.cordaInfo;
        lastValidTime = Date.now();

        gestisciAnnuncioVocale(note.name, stato, note.cordaInfo);
      } else {
        if (Date.now() - lastValidTime > 3000) {
          mainStatus.textContent = "ASCOLTO...";
          subStatus.textContent = "Scorri ai lati per cambiare strumento";
          targetPosPercent = 50;
          lastSpokenPhrase = "";
        }
      }
    }

    currentPosPercent += (targetPosPercent - currentPosPercent) * 0.15;
    gaugeNeedle.style.left = `${currentPosPercent.toFixed(2)}%`;

    if (isRunning) {
      requestAnimationFrame(updatePitch);
    }
  }

  async function startTuner() {
    try {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const stream = await navigator.mediaDevices.getUserMedia({ 
        audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } 
      });
      const source = audioCtx.createMediaStreamSource(stream);
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 2048;
      source.connect(analyser);

      isRunning = true;
      parla(`Accordatore attivo. ${MODALITA_STRUMENTI[indexModalita].nome}`);
      updatePitch();
    } catch (err) {
      alert("Errore microfono: " + err.message);
    }
  }

  let touchStartX = 0;
  let touchStartY = 0;

  touchZone.addEventListener('touchstart', (e) => {
    touchStartX = e.changedTouches[0].screenX;
    touchStartY = e.changedTouches[0].screenY;
  }, { passive: true });

  touchZone.addEventListener('touchend', (e) => {
    const touchEndX = e.changedTouches[0].screenX;
    const touchEndY = e.changedTouches[0].screenY;
    const diffX = touchEndX - touchStartX;
    const diffY = touchEndY - touchStartY;

    if (Math.abs(diffX) > 50 && Math.abs(diffX) > Math.abs(diffY)) {
      if (diffX < 0) {
        cambiaModalita(1);
      } else {
        cambiaModalita(-1);
      }
    } else if (Math.abs(diffX) < 10 && Math.abs(diffY) < 10) {
      gestisciToccoSingolo();
    }
  }, { passive: true });

  function gestisciToccoSingolo() {
    if (!isRunning) {
      startTuner();
    } else {
      const tempoTrascorso = Date.now() - lastValidTime;
      if (lastValidNote && tempoTrascorso < 4000) {
        const statoParlato = lastValidStatus === "troppo bassa"
          ? "troppo basso"
          : lastValidStatus === "troppo alta"
            ? "troppo alto"
            : "accordato";
        if (lastValidCorda) {
          parla(`Corda ${lastValidCorda.numero} ${lastValidCorda.nota}, ${statoParlato}`);
        } else {
          parla(`${lastValidNote}, ${statoParlato}`);
        }
      } else {
        parla("Nessun suono rilevato");
      }
    }
  }

  touchZone.addEventListener('click', (e) => {
    if (e.pointerType === 'mouse') {
      gestisciToccoSingolo();
    }
  });

  window.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight') cambiaModalita(1);
    if (e.key === 'ArrowLeft') cambiaModalita(-1);
    if (e.key === ' ' || e.key === 'Enter') gestisciToccoSingolo();
  });
</script>

</body>
</html>
